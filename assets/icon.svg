<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 顶面草方块渐变 -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec962" />
      <stop offset="50%" stop-color="#3ba546" />
      <stop offset="100%" stop-color="#2e8538" />
    </linearGradient>
    <!-- 左侧泥土渐变 -->
    <linearGradient id="dirtLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b6e4c" />
      <stop offset="35%" stop-color="#805638" />
      <stop offset="100%" stop-color="#593b24" />
    </linearGradient>
    <!-- 右侧泥土阴影渐变 -->
    <linearGradient id="dirtRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5438" />
      <stop offset="35%" stop-color="#66432a" />
      <stop offset="100%" stop-color="#442a17" />
    </linearGradient>
    <!-- 切片层发光渐变 (3D Slicing Laser) -->
    <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>
    <!-- 切片发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- 底部阴影滤镜 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 底部微投影 -->
  <ellipse cx="256" cy="428" rx="168" ry="48" fill="#0f172a" opacity="0.18" filter="url(#dropShadow)" />

  <!-- 主体方块组 -->
  <g id="voxel-block">
    <!-- 下层切片基座 (Bottom Voxel Slice) -->
    <!-- 左侧下半截 -->
    <polygon points="256,290 88,193 88,340 256,437" fill="url(#dirtLeftGrad)" />
    <!-- 右侧下半截 -->
    <polygon points="256,290 424,193 424,340 256,437" fill="url(#dirtRightGrad)" />

    <!-- 切片激光间隙/切片网格层 (Active Slicing Plane) -->
    <g filter="url(#neonGlow)">
      <!-- 激光平面顶面 -->
      <polygon points="256,260 96,168 256,76 416,168" fill="url(#sliceGrad)" opacity="0.85" />
      <!-- 激光平面侧边发光外沿 -->
      <polygon points="256,274 96,182 96,168 256,260" fill="#38bdf8" />
      <polygon points="256,274 416,182 416,168 256,260" fill="#0284c7" />
    </g>

    <!-- 上层切片 (Top Voxel Slice - 悬浮体素块) -->
    <!-- 上层左侧面 -->
    <polygon points="256,242 104,154 104,204 256,292" fill="url(#dirtLeftGrad)" />
    <!-- 上层左侧草地垂边 (Minecraft 经典草缘边缘) -->
    <path d="M 104,154 L 256,242 L 256,266 L 230,251 L 230,260 L 204,245 L 204,254 L 178,239 L 178,248 L 152,233 L 152,242 L 126,227 L 126,236 L 104,223 Z" fill="#3ba546" />

    <!-- 上层右侧面 -->
    <polygon points="256,242 408,154 408,204 256,292" fill="url(#dirtRightGrad)" />
    <!-- 上层右侧草地垂边 (草缘边缘) -->
    <path d="M 256,242 L 408,154 L 408,223 L 386,236 L 386,227 L 360,242 L 360,233 L 334,248 L 334,239 L 308,254 L 308,245 L 282,260 L 282,251 L 256,266 Z" fill="#2e8538" />

    <!-- 上层顶面 (Grass Top Face) -->
    <polygon points="256,66 408,154 256,242 104,154" fill="url(#grassGrad)" stroke="#68d391" stroke-width="2.5" stroke-linejoin="round" />

    <!-- 顶面 3D 体素切片网格与光影细节 (Voxel Coordinate Grid) -->
    <!-- 对角与体素 3x3 辅助分割网格 -->
    <g stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.32" stroke-linecap="round">
      <!-- 纵横切片指示线 -->
      <line x1="155" y1="183" x2="307" y2="95" />
      <line x1="205" y1="213" x2="357" y2="125" />
      <line x1="205" y1="95" x2="357" y2="183" />
      <line x1="155" y1="125" x2="307" y2="213" />
    </g>

    <!-- 顶部高光倒角边缘 -->
    <polyline points="104,154 256,66 408,154" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <polyline points="104,154 256,242 408,154" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>